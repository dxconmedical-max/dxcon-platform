services:
  - type: web
    name: dxcon-api-staging
    env: python
    plan: starter
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -c gunicorn.conf.py run:app
    healthCheckPath: /api/v1/system/health
    envVars:
      - key: APP_ENV
        value: staging
      - key: LOG_FORMAT
        value: json
      - key: STARTUP_VALIDATE_DB
        value: "true"
      - key: DEMO_MODE
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: dxcon-staging-postgres
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://staging.dxcon.com.vn,https://app-staging.dxcon.com.vn
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        value: noreply@dxcon.com.vn
      - key: SMTP_USE_TLS
        value: "true"
      - key: BUILD_VERSION
        value: "9.0.0-staging"

databases:
  - name: dxcon-staging-postgres
    databaseName: dxcon_staging
    user: dxcon_staging_user
    plan: basic-256mb
