services:
  - type: web
    name: dxcon-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -c gunicorn.conf.py run:app
    healthCheckPath: /api/v1/system/health
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_FORMAT
        value: json
      - key: STARTUP_VALIDATE_DB
        value: "true"
      - key: CORS_ORIGINS
        value: https://dxcon.com.vn,https://www.dxcon.com.vn,https://app.dxcon.com.vn,https://admin.dxcon.com.vn,https://lab.dxcon.com.vn,https://doctor.dxcon.com.vn,https://patient.dxcon.com.vn,https://collector.dxcon.com.vn,https://clinic.dxcon.com.vn
      - key: DEMO_MODE
        value: "false"
      - key: API_AUTH_GATE_ENABLED
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: dxcon-postgres
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: EMAIL_DRY_RUN
        value: "true"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_FROM
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: BUILD_VERSION
        value: "2.0.0-rc1"

  - type: worker
    name: dxcon-worker
    env: python
    branch: security/p0a-authenticated-identity
    buildCommand: pip install -r requirements.txt
    startCommand: python production_start.py worker
    envVars:
      - key: APP_ENV
        fromService:
          type: web
          name: dxcon-api
          envVarKey: APP_ENV
      - key: QUEUE_PROVIDER
        value: redis
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: dxcon-api
          envVarKey: CORS_ORIGINS
      - key: LOG_FORMAT
        fromService:
          type: web
          name: dxcon-api
          envVarKey: LOG_FORMAT
      - key: SECRET_KEY
        fromService:
          type: web
          name: dxcon-api
          envVarKey: SECRET_KEY
      - key: JWT_SECRET_KEY
        fromService:
          type: web
          name: dxcon-api
          envVarKey: JWT_SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: dxcon-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: web
          name: dxcon-api
          envVarKey: REDIS_URL
      - key: SMTP_HOST
        fromService:
          type: web
          name: dxcon-api
          envVarKey: SMTP_HOST
      - key: SMTP_PORT
        fromService:
          type: web
          name: dxcon-api
          envVarKey: SMTP_PORT
      - key: SMTP_FROM
        fromService:
          type: web
          name: dxcon-api
          envVarKey: SMTP_FROM
      - key: SMTP_USE_TLS
        fromService:
          type: web
          name: dxcon-api
          envVarKey: SMTP_USE_TLS

  - type: worker
    name: dxcon-scheduler
    env: python
    branch: security/p0a-authenticated-identity
    buildCommand: pip install -r requirements.txt
    startCommand: python production_start.py scheduler
    envVars:
      - key: APP_ENV
        fromService:
          type: web
          name: dxcon-api
          envVarKey: APP_ENV
      - key: QUEUE_PROVIDER
        value: redis
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: dxcon-api
          envVarKey: CORS_ORIGINS
      - key: LOG_FORMAT
        fromService:
          type: web
          name: dxcon-api
          envVarKey: LOG_FORMAT
      - key: SECRET_KEY
        fromService:
          type: web
          name: dxcon-api
          envVarKey: SECRET_KEY
      - key: JWT_SECRET_KEY
        fromService:
          type: web
          name: dxcon-api
          envVarKey: JWT_SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: dxcon-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: web
          name: dxcon-api
          envVarKey: REDIS_URL
      - key: SMTP_HOST
        fromService:
          type: web
          name: dxcon-api
          envVarKey: SMTP_HOST
      - key: SMTP_PORT
        fromService:
          type: web
          name: dxcon-api
          envVarKey: SMTP_PORT
      - key: SMTP_FROM
        fromService:
          type: web
          name: dxcon-api
          envVarKey: SMTP_FROM
      - key: SMTP_USE_TLS
        fromService:
          type: web
          name: dxcon-api
          envVarKey: SMTP_USE_TLS

databases:
  - name: dxcon-postgres
    databaseName: dxcon
    user: dxcon_user
