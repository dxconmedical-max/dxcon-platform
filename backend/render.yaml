services:
  - type: web
    name: dxcon-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -c gunicorn.conf.py run:app
    healthCheckPath: /api/v1/system/health
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_FORMAT
        value: json
      - key: STARTUP_VALIDATE_DB
        value: "true"
      - key: CORS_ORIGINS
        value: https://dxcon.com.vn,https://www.dxcon.com.vn,https://app.dxcon.com.vn,https://admin.dxcon.com.vn,https://lab.dxcon.com.vn,https://doctor.dxcon.com.vn,https://patient.dxcon.com.vn,https://collector.dxcon.com.vn,https://clinic.dxcon.com.vn
      - key: DEMO_MODE
        value: "false"
      - key: API_AUTH_GATE_ENABLED
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: dxcon-postgres
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: EMAIL_DRY_RUN
        value: "true"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_FROM
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: BUILD_VERSION
        value: "2.0.0-rc1"

databases:
  - name: dxcon-postgres
    databaseName: dxcon
    user: dxcon_user
