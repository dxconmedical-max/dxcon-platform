name: DxCon Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-check:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint compile
        run: |
          python -m compileall app scripts tests

      - name: Unit tests
        env:
          DATABASE_URL: sqlite:///:memory:
        run: |
          python -m unittest \
            tests.test_rc_security_gate \
            tests.test_cors_hardening \
            tests.test_reception_workspace \
            tests.test_laboratory_workflow \
            tests.test_report_pdf \
            tests.test_role_dashboards \
            tests.test_executive_platform \
            tests.test_portal_workspace \
            tests.test_reporting_engine \
            -v

      - name: Health check
        env:
          DATABASE_URL: sqlite:///:memory:
        run: |
          python3 scripts/health_check.py

      - name: Route check
        env:
          DATABASE_URL: sqlite:///:memory:
        run: |
          python3 scripts/check_routes.py

      - name: Release 1 verification
        env:
          DATABASE_URL: sqlite:///:memory:
        run: |
          python3 scripts/verify_release_1.py

  docker-build:
    runs-on: ubuntu-latest
    needs: backend-check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production image
        run: |
          docker build -t dxcon-api:ci ./backend
