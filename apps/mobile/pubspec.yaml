name: dxcon_mobile
description: DxCon official mobile platform — Patient, Collector, Doctor, Clinic, Lab, Executive.
publish_to: "none"
version: 2.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^6.1.4
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  mobile_scanner: ^7.0.0
  image_picker: ^1.1.2
  geolocator: ^14.0.0
  permission_handler: ^12.0.0+1
  url_launcher: ^6.3.1
  intl: ^0.20.2
  package_info_plus: ^8.3.0
  device_info_plus: ^11.4.0
  sentry_flutter: ^8.14.2
  flutter_local_notifications: ^19.2.1
  uuid: ^4.5.1
  path_provider: ^2.1.5
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/
